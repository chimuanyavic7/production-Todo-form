name: Todo app CI + GitOps (ArgoCD)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.txt'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}

permissions:
  contents: write

jobs:

# ---------------- DETECT CHANGES ----------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend/backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'


# ---------------- CI ----------------
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v4

      # Frontend tests (only if changed)
      - name: Frontend Install & Test
        if: needs.changes.outputs.frontend == 'true'
        run: |
          cd frontend
          if [ -f package.json ]; then
            npm ci
            npm test
          else
            echo "No frontend project found"
            exit 0
          fi


      # Backend tests (only if changed)
      - name: backend Install & Test
        if: needs.changes.outputs.frontend == 'true'
        run: |
          cd backend
          if [ -f package.json ]; then
            npm ci
            npm test
          else
            echo "No backend project found"
            exit 0
          fi

# ---------------- VERSION ----------------
  version:
    name: Versioning
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.bump.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version tag
        id: last_version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="v1.0.0"
          fi

          echo "last=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          LAST=${{ steps.last_version.outputs.last }}
          VERSION=${LAST#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          commit_message=$(git log -1 --pretty=%B)

          RELEASE=false

          if [[ "$commit_message" == major:* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            RELEASE=true

          elif [[ "$commit_message" == minor:* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            RELEASE=true

          elif [[ "$commit_message" == patch:* ]]; then
            PATCH=$((PATCH + 1))
            RELEASE=true
          fi

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.bump.outputs.release == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.bump.outputs.version }}
          git push origin ${{ steps.bump.outputs.version }}


# ---------------- DOCKER ----------------
  docker:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [version, changes]

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FRONTEND IMAGE (only if changed)
      - name: Build & Push Frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_NAME }}/frontend-dev:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Security: provenance and SBOM
          provenance: true
          sbom: true

      # BACKEND IMAGE (only if changed)
      - name: Build & Push Backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_NAME }}/backend-dev:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Security: provenance and SBOM
          provenance: true
          sbom: true



# ---------------- IMAGE SCAN ----------------
  image-scan:
    name: "🔬 Scan ${{ matrix.component }} Image"
    runs-on: ubuntu-latest
    needs: [docker, changes]

    strategy:
      matrix:
        component: [frontend, backend]

    if: |
      (matrix.component == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.component == 'backend' && needs.changes.outputs.backend == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}-${{ matrix.component }}:scan ./${{ matrix.component }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}-${{ matrix.component }}:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"




# ---------------- HELM VALIDATION ----------------
  validate:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: [docker, version]

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint helm/todo-app

      - name: Helm template test
        run: |
          helm template helm/todo-app \
            --set frontend.tag=${{ needs.version.outputs.version }} \
            --set backend.tag=${{ needs.version.outputs.version }}


# ---------------- GITOPS ----------------
  gitops:
    name: Update ArgoCD Repo (In-Repo GitOps)
    runs-on: ubuntu-latest
    needs: [validate, version]

    steps:
      - uses: actions/checkout@v4

      - name: Setup yq
        uses: mikefarah/yq@v4.44.3

      - name: Update Helm values
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Updating version: $VERSION"

          yq eval -i ".frontend.tag = \"$VERSION\"" helm/todo-app/values.yaml
          yq eval -i ".backend.tag = \"$VERSION\"" helm/todo-app/values.yaml

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/todo-app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "deploy: ${{ needs.version.outputs.version }}"
          git push origin main