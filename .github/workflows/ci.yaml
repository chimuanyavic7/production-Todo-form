name: Todo app CI + GitOps (ArgoCD)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.txt'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}

permissions:
  contents: write


# ---------------- DETECT CHANGES ----------------
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'


# =========================================================
# 🟢 FRONTEND PIPELINE (FULL ISOLATED FLOW)
# =========================================================

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm test -- --passWithNoTests


  frontend-version:
    name: Frontend Version
    runs-on: ubuntu-latest
    needs: frontend-ci

    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: last
        run: |
          git fetch --tags
          LAST=$(git tag -l "frontend-v*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST" ]; then LAST="v1.0.0"; fi
          echo "last=$LAST" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          VERSION=${{ steps.last.outputs.last }}
          VERSION=${VERSION#frontend-v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))
          NEW="frontend-v$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW" >> $GITHUB_OUTPUT


  frontend-docker:
    name: Frontend Docker
    runs-on: ubuntu-latest
    needs: frontend-version

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_NAME }}/frontend-dev:${{ needs.frontend-version.outputs.version }}


  frontend-gitops:
    name: Frontend GitOps
    runs-on: ubuntu-latest
    needs: [frontend-version, frontend-docker]

    steps:
      - uses: actions/checkout@v4

      - uses: mikefarah/yq@v4.44.3

      - name: Update Helm
        run: |
          yq eval -i ".frontend.tag = \"${{ needs.frontend-version.outputs.version }}\"" helm/todo-app/values.yaml

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/todo-app/values.yaml
          git commit -m "deploy frontend ${{ needs.frontend-version.outputs.version }}" || exit 0
          git push origin main


# =========================================================
# 🔵 BACKEND PIPELINE (FULL ISOLATED FLOW)
# =========================================================

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: backend
        run: npm install

      - working-directory: backend
        run: npm test -- --passWithNoTests


  backend-version:
    name: Backend Version
    runs-on: ubuntu-latest
    needs: backend-ci

    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: last
        run: |
          git fetch --tags
          LAST=$(git tag -l "backend-v*" --sort=-v:refname | head -n 1)
          if [ -z "$LAST" ]; then LAST="backend-v1.0.0"; fi
          echo "last=$LAST" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          VERSION=${{ steps.last.outputs.last }}
          VERSION=${VERSION#backend-v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))
          NEW="backend-v$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW" >> $GITHUB_OUTPUT


  backend-docker:
    name: Backend Docker
    runs-on: ubuntu-latest
    needs: backend-version

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_NAME }}/backend-dev:${{ needs.backend-version.outputs.version }}


  backend-gitops:
    name: Backend GitOps
    runs-on: ubuntu-latest
    needs: [backend-version, backend-docker]

    steps:
      - uses: actions/checkout@v4

      - uses: mikefarah/yq@v4.44.3

      - name: Update Helm
        run: |
          yq eval -i ".backend.tag = \"${{ needs.backend-version.outputs.version }}\"" helm/todo-app/values.yaml

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/todo-app/values.yaml
          git commit -m "deploy backend ${{ needs.backend-version.outputs.version }}" || exit 0
          git push origin main